name: Front Web QA — Playwright Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: 'Projeto / navegador a executar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - webkit
          - mobile-safari
      tag:
        description: 'Filtro por tag (opcional)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '@smoke'
          - '@users'
          - '@forms'
          - '@dynamic'
          - '@a11y'
          - '@mobile'
          - '@negative'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  BASE_URL: https://playwrightlab.github.io/

jobs:
  # O contexto `matrix` não pode ser usado no `if` de um job. Por isso a matriz é montada aqui,
  # já filtrada pelo projeto escolhido no disparo manual, e consumida via fromJSON no job e2e.
  plan:
    name: Plan test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        env:
          SELECTED_PROJECT: ${{ inputs.project || 'all' }}
        run: |
          all='[{"project":"chromium","browser":"chromium"},{"project":"webkit","browser":"webkit"},{"project":"mobile-safari","browser":"webkit"}]'
          if [ "$SELECTED_PROJECT" = "all" ]; then
            selected="$all"
          else
            selected=$(echo "$all" | jq -c --arg p "$SELECTED_PROJECT" '[.[] | select(.project == $p)]')
          fi
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"
          echo "Matriz: $selected"

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  e2e-tests:
    name: Playwright (${{ matrix.project }})
    needs: [plan, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser (${{ matrix.browser }})
        if: steps.browsers-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install browser system dependencies (cache hit)
        if: steps.browsers-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        env:
          SELECTED_TAG: ${{ inputs.tag || 'all' }}
          PW_BLOB_NAME: ${{ matrix.project }}
        run: |
          if [ "$SELECTED_TAG" != "all" ]; then
            npx playwright test --project=${{ matrix.project }} --grep "$SELECTED_TAG" --pass-with-no-tests
          else
            npx playwright test --project=${{ matrix.project }}
          fi

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure evidences (traces, screenshots, videos)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

  merge-reports:
    name: Merge reports
    needs: e2e-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports

      - name: Publish execution summary
        run: |
          {
            echo "## Resultado da suíte Playwright"
            echo
            jq -r '"| Passaram | Falharam | Instáveis (flaky) | Ignorados | Duração (s) |\n|---:|---:|---:|---:|---:|\n| \(.stats.expected) | \(.stats.unexpected) | \(.stats.flaky) | \(.stats.skipped) | \(.stats.duration / 1000 | floor) |"' results.json
            echo
            echo "Relatório consolidado: artefato **playwright-report-merged** (abrir com \`npx playwright show-report\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 14
